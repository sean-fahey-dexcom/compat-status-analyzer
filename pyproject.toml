[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "I",   # isort
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "A",   # detect shadowed builtins
    "COM", # enforce trailing comma rules
    "ISC", # Good use of string concatenation
    "ICN", # Use common import conventions
    "RET", # Good return practices
    "TID", # Some good import practices
    "TD",  # Be diligent with TODO comments
    "FURB", # see https://pypi.org/project/refurb/
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "COM812", # trailing comma missing (handled by formatter)
    "ISC001", # single line implicit string concatenation (handled by formatter)
    "C901",   # function is too complex
    "N805",   # first argument of instance method should be named 'self',
    "TD003",  # TODO requires issue link
    "N999",   # allow names that don't conform to pep8 naming conventions
]

[tool.ruff.lint.pep8-naming]
ignore-names = [
    "g7"
]

[tool.ruff.lint.pydocstyle]
convention = "google"
